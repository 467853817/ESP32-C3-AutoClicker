name: Build ESP32-C3 Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Fix ESP32-BLE-HID compatibility
        run: |
          LIB=".pio/libdeps/esp32-c3-devkitm-1/ESP32-BLE-HID/BleComboMouse.cpp"
          mkdir -p "$(dirname "$LIB")"
          sed -i '1i#include <Arduino.h>' "$LIB"

      - name: Build firmware
        run: pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-C3-AutoClicker
          path: .pio/build/esp32-c3-devkitm-1/firmware.bin
